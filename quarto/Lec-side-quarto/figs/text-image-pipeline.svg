<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-label="Text and image encoders produce vectors; the recommender fuses those vectors with tabular features.">
  <defs>
    <marker id="arrow-gold4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dda300"/>
    </marker>
    <marker id="arrow-muted4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a8791"/>
    </marker>
    <style>
      .box { fill: #151b22; stroke: rgba(255,255,255,.20); stroke-width: 1.4; }
      .gold { stroke: #dda300; }
      .violet { stroke: #a65b9f; }
      .cyan { stroke: #4fb3bf; }
      .txt { fill: #f2f0eb; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 20px; }
      .small { fill: #c3c0c8; font-family: Menlo, monospace; font-size: 14px; }
      .kicker { fill: #dda300; font-family: Menlo, monospace; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
      .line { stroke: #8a8791; stroke-width: 1.6; fill: none; }
      .line-gold { stroke: #dda300; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <text x="40" y="38" class="kicker">TEXT</text>
  <rect x="40" y="60" width="220" height="64" rx="6" class="box violet"/>
  <text x="60" y="86" class="txt">raw text</text>
  <text x="60" y="108" class="small">title, review, query</text>

  <rect x="300" y="60" width="180" height="64" rx="6" class="box violet"/>
  <text x="320" y="86" class="txt">tokenizer</text>
  <text x="320" y="108" class="small">tokens / ids</text>

  <rect x="520" y="60" width="220" height="64" rx="6" class="box violet"/>
  <text x="540" y="86" class="txt">LLM encoder</text>
  <text x="540" y="108" class="small">frozen or fine-tuned</text>

  <rect x="780" y="60" width="180" height="64" rx="6" class="box cyan"/>
  <text x="800" y="86" class="txt">e_text</text>
  <text x="800" y="108" class="small">(B, d_text)</text>

  <line x1="260" y1="92" x2="300" y2="92" class="line" marker-end="url(#arrow-muted4)"/>
  <line x1="480" y1="92" x2="520" y2="92" class="line" marker-end="url(#arrow-muted4)"/>
  <line x1="740" y1="92" x2="780" y2="92" class="line" marker-end="url(#arrow-muted4)"/>

  <text x="40" y="188" class="kicker">IMAGE</text>
  <rect x="40" y="210" width="220" height="64" rx="6" class="box gold"/>
  <text x="60" y="236" class="txt">raw image</text>
  <text x="60" y="258" class="small">item photo, avatar</text>

  <rect x="300" y="210" width="180" height="64" rx="6" class="box gold"/>
  <text x="320" y="236" class="txt">resize</text>
  <text x="320" y="258" class="small">augmentation</text>

  <rect x="520" y="210" width="220" height="64" rx="6" class="box gold"/>
  <text x="540" y="236" class="txt">CNN / ViT</text>
  <text x="540" y="258" class="small">pretrained backbone</text>

  <rect x="780" y="210" width="180" height="64" rx="6" class="box cyan"/>
  <text x="800" y="236" class="txt">e_image</text>
  <text x="800" y="258" class="small">(B, d_image)</text>

  <line x1="260" y1="242" x2="300" y2="242" class="line" marker-end="url(#arrow-muted4)"/>
  <line x1="480" y1="242" x2="520" y2="242" class="line" marker-end="url(#arrow-muted4)"/>
  <line x1="740" y1="242" x2="780" y2="242" class="line" marker-end="url(#arrow-muted4)"/>

  <rect x="1040" y="120" width="300" height="120" rx="6" class="box cyan"/>
  <text x="1060" y="160" class="txt">fusion</text>
  <text x="1060" y="188" class="small">concat with ID / tabular features</text>
  <text x="1060" y="210" class="small">or a separate encoder tower</text>

  <line x1="960" y1="92" x2="1040" y2="140" class="line-gold" marker-end="url(#arrow-gold4)"/>
  <line x1="960" y1="242" x2="1040" y2="220" class="line-gold" marker-end="url(#arrow-gold4)"/>

  <text x="40" y="360" class="txt" font-size="24">A pretrained encoder is just a feature extractor.</text>
  <text x="40" y="392" class="small" font-size="18">The recommender only needs the output vector; the encoder can stay frozen.</text>

  <text x="40" y="470" class="txt" font-size="21">Text is high-dimensional and sparse; images are dense but expensive.</text>
  <text x="40" y="502" class="small" font-size="18">Decide dimension, normalization, caching, and whether to fine-tune.</text>
</svg>
