<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="380" viewBox="0 0 1600 380" role="img" aria-label="Two-tower model: user and item features are encoded separately, then combined by a dot product or a small MLP.">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dda300"/>
    </marker>
    <style>
      .box { fill: #151b22; stroke: rgba(255,255,255,.20); stroke-width: 1.4; }
      .gold { stroke: #dda300; }
      .violet { stroke: #a65b9f; }
      .cyan { stroke: #4fb3bf; }
      .txt { fill: #f2f0eb; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 21px; }
      .small { fill: #c3c0c8; font-family: Menlo, monospace; font-size: 15px; }
      .kicker { fill: #dda300; font-family: Menlo, monospace; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
      .line { stroke: #dda300; stroke-width: 1.7; fill: none; }
    </style>
  </defs>

  <text x="40" y="42" class="kicker">USER TOWER</text>
  <rect x="40" y="62" width="320" height="72" rx="6" class="box violet"/>
  <text x="58" y="90" class="txt">user ID + profile</text>
  <text x="58" y="114" class="small">numeric + categorical + content</text>

  <rect x="410" y="62" width="320" height="72" rx="6" class="box gold"/>
  <text x="428" y="90" class="txt">user tower</text>
  <text x="428" y="114" class="small">MLP</text>

  <rect x="780" y="62" width="180" height="72" rx="6" class="box gold"/>
  <text x="798" y="90" class="txt">h_u</text>
  <text x="798" y="114" class="small">user vector</text>

  <text x="40" y="184" class="kicker">ITEM TOWER</text>
  <rect x="40" y="204" width="320" height="72" rx="6" class="box gold"/>
  <text x="58" y="232" class="txt">item ID + content</text>
  <text x="58" y="256" class="small">numeric + categorical + content</text>

  <rect x="410" y="204" width="320" height="72" rx="6" class="box gold"/>
  <text x="428" y="232" class="txt">item tower</text>
  <text x="428" y="256" class="small">MLP</text>

  <rect x="780" y="204" width="180" height="72" rx="6" class="box gold"/>
  <text x="798" y="232" class="txt">h_i</text>
  <text x="798" y="256" class="small">item vector</text>

  <rect x="1020" y="100" width="220" height="136" rx="6" class="box cyan"/>
  <text x="1038" y="150" class="txt">interaction</text>
  <text x="1038" y="174" class="small">dot or small MLP</text>

  <rect x="1300" y="128" width="180" height="80" rx="6" class="box gold"/>
  <text x="1390" y="174" class="txt" text-anchor="middle">rating</text>

  <line x1="360" y1="98" x2="410" y2="98" class="line" marker-end="url(#arrow)"/>
  <line x1="730" y1="98" x2="780" y2="98" class="line" marker-end="url(#arrow)"/>
  <line x1="360" y1="240" x2="410" y2="240" class="line" marker-end="url(#arrow)"/>
  <line x1="730" y1="240" x2="780" y2="240" class="line" marker-end="url(#arrow)"/>
  <line x1="960" y1="98" x2="1020" y2="120" class="line" marker-end="url(#arrow)"/>
  <line x1="960" y1="240" x2="1020" y2="216" class="line" marker-end="url(#arrow)"/>
  <line x1="1240" y1="168" x2="1300" y2="168" class="line" marker-end="url(#arrow)"/>

  <text x="40" y="330" class="txt" font-size="23">Each tower encodes its own side; the last step learns the interaction.</text>
  <text x="40" y="360" class="small" font-size="17">For an unseen ID, set its embedding to zero; the feature path still produces a vector.</text>
</svg>
