<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-label="Two-tower model: user and item features are encoded separately, then combined by a dot product or a small MLP.">
  <defs>
    <marker id="arrow-gold3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dda300"/>
    </marker>
    <marker id="arrow-muted3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a8791"/>
    </marker>
    <style>
      .box { fill: #151b22; stroke: rgba(255,255,255,.20); stroke-width: 1.4; }
      .gold { stroke: #dda300; }
      .violet { stroke: #a65b9f; }
      .cyan { stroke: #4fb3bf; }
      .optional { stroke-dasharray: 5 4; stroke: #4fb3bf; }
      .txt { fill: #f2f0eb; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 20px; }
      .small { fill: #c3c0c8; font-family: Menlo, monospace; font-size: 14px; }
      .kicker { fill: #dda300; font-family: Menlo, monospace; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
      .line { stroke: #8a8791; stroke-width: 1.6; fill: none; }
      .line-gold { stroke: #dda300; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <text x="40" y="38" class="kicker">USER TOWER</text>
  <rect x="60" y="60" width="180" height="54" rx="6" class="box violet"/>
  <text x="78" y="93" class="txt">user ID</text>
  <rect x="260" y="60" width="200" height="54" rx="6" class="box gold"/>
  <text x="278" y="93" class="txt">continuous</text>
  <rect x="60" y="130" width="180" height="54" rx="6" class="box violet"/>
  <text x="78" y="163" class="txt">categorical</text>
  <rect x="260" y="130" width="200" height="54" rx="6" class="box optional"/>
  <text x="278" y="163" class="txt">text / image</text>
  <text x="278" y="180" class="small">optional</text>

  <rect x="60" y="230" width="400" height="60" rx="6" class="box gold"/>
  <text x="80" y="258" class="txt">user MLP  <tspan class="small">F_u(u, x_u)</tspan></text>
  <text x="80" y="280" class="small">ID lookup + categorical embedding + numeric vector</text>

  <rect x="160" y="330" width="200" height="54" rx="6" class="box gold"/>
  <text x="260" y="363" class="txt" text-anchor="middle">h_u</text>

  <line x1="150" y1="114" x2="150" y2="230" class="line" marker-end="url(#arrow-muted3)"/>
  <line x1="360" y1="114" x2="360" y2="230" class="line" marker-end="url(#arrow-muted3)"/>
  <line x1="150" y1="184" x2="150" y2="230" class="line" marker-end="url(#arrow-muted3)"/>
  <line x1="360" y1="184" x2="360" y2="230" class="line" marker-end="url(#arrow-muted3)"/>
  <line x1="260" y1="290" x2="260" y2="330" class="line-gold" marker-end="url(#arrow-gold3)"/>

  <text x="880" y="38" class="kicker">ITEM TOWER</text>
  <rect x="1160" y="60" width="180" height="54" rx="6" class="box violet"/>
  <text x="1178" y="93" class="txt">item ID</text>
  <rect x="940" y="60" width="200" height="54" rx="6" class="box gold"/>
  <text x="958" y="93" class="txt">continuous</text>
  <rect x="1160" y="130" width="180" height="54" rx="6" class="box violet"/>
  <text x="1178" y="163" class="txt">categorical</text>
  <rect x="940" y="130" width="200" height="54" rx="6" class="box optional"/>
  <text x="958" y="163" class="txt">text / image</text>
  <text x="958" y="180" class="small">optional</text>

  <rect x="940" y="230" width="400" height="60" rx="6" class="box gold"/>
  <text x="960" y="258" class="txt">item MLP  <tspan class="small">F_i(i, z_i)</tspan></text>
  <text x="960" y="280" class="small">ID lookup + categorical embedding + numeric vector</text>

  <rect x="1040" y="330" width="200" height="54" rx="6" class="box gold"/>
  <text x="1140" y="363" class="txt" text-anchor="middle">h_i</text>

  <line x1="1250" y1="114" x2="1250" y2="230" class="line" marker-end="url(#arrow-muted3)"/>
  <line x1="1040" y1="114" x2="1040" y2="230" class="line" marker-end="url(#arrow-muted3)"/>
  <line x1="1250" y1="184" x2="1250" y2="230" class="line" marker-end="url(#arrow-muted3)"/>
  <line x1="1040" y1="184" x2="1040" y2="230" class="line" marker-end="url(#arrow-muted3)"/>
  <line x1="1140" y1="290" x2="1140" y2="330" class="line-gold" marker-end="url(#arrow-gold3)"/>

  <rect x="560" y="470" width="280" height="64" rx="6" class="box cyan"/>
  <text x="580" y="498" class="txt">interaction</text>
  <text x="580" y="520" class="small">dot product or small MLP</text>

  <rect x="880" y="470" width="180" height="64" rx="6" class="box gold"/>
  <text x="970" y="509" class="txt" text-anchor="middle">rating</text>

  <polyline points="260,384 260,430 560,430 560,470" class="line-gold" marker-end="url(#arrow-gold3)"/>
  <polyline points="1140,384 1140,430 840,430 840,470" class="line-gold" marker-end="url(#arrow-gold3)"/>
  <line x1="840" y1="502" x2="880" y2="502" class="line-gold" marker-end="url(#arrow-gold3)"/>

  <text x="40" y="585" class="txt" font-size="24">New user: set the ID row to zero; the feature encoder still produces <tspan class="small" font-size="24">h_u</tspan>.</text>
  <text x="40" y="617" class="small" font-size="18">Two towers keep user and item encoders separate until the final interaction.</text>
</svg>
