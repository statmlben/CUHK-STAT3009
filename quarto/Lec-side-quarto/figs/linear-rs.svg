<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-label="Linear side-aware model: ID and categorical embeddings plus continuous feature maps build user and item factors, then a dot product predicts the rating.">
  <defs>
    <marker id="arrow-gold2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dda300"/>
    </marker>
    <marker id="arrow-muted2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a8791"/>
    </marker>
    <style>
      .box { fill: #151b22; stroke: rgba(255,255,255,.20); stroke-width: 1.4; }
      .gold { stroke: #dda300; }
      .violet { stroke: #a65b9f; }
      .cyan { stroke: #4fb3bf; }
      .txt { fill: #f2f0eb; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 20px; }
      .small { fill: #c3c0c8; font-family: Menlo, monospace; font-size: 14px; }
      .kicker { fill: #dda300; font-family: Menlo, monospace; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
      .line { stroke: #8a8791; stroke-width: 1.6; fill: none; }
      .line-gold { stroke: #dda300; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <text x="40" y="40" class="kicker">USER BRANCH</text>
  <rect x="40" y="60" width="190" height="64" rx="6" class="box violet"/>
  <text x="60" y="86" class="txt">user ID <tspan class="small">u</tspan></text>
  <text x="60" y="108" class="small">learned row p_u</text>

  <rect x="260" y="60" width="190" height="64" rx="6" class="box violet"/>
  <text x="280" y="86" class="txt">categorical</text>
  <text x="280" y="108" class="small">embedding E_u c_u</text>

  <rect x="480" y="60" width="190" height="64" rx="6" class="box gold"/>
  <text x="500" y="86" class="txt">continuous</text>
  <text x="500" y="108" class="small">linear map A x_u</text>

  <rect x="720" y="60" width="420" height="64" rx="6" class="box gold"/>
  <text x="740" y="86" class="txt">user factor</text>
  <text x="740" y="108" class="small">p(u,x_u) = p_u + E_u c_u + A x_u</text>

  <line x1="230" y1="92" x2="260" y2="92" class="line" marker-end="url(#arrow-muted2)"/>
  <line x1="450" y1="92" x2="480" y2="92" class="line" marker-end="url(#arrow-muted2)"/>
  <line x1="670" y1="92" x2="720" y2="92" class="line" marker-end="url(#arrow-muted2)"/>

  <text x="40" y="180" class="kicker">ITEM BRANCH</text>
  <rect x="40" y="200" width="190" height="64" rx="6" class="box violet"/>
  <text x="60" y="226" class="txt">item ID <tspan class="small">i</tspan></text>
  <text x="60" y="248" class="small">learned row q_i</text>

  <rect x="260" y="200" width="190" height="64" rx="6" class="box violet"/>
  <text x="280" y="226" class="txt">categorical</text>
  <text x="280" y="248" class="small">embedding E_i g_i</text>

  <rect x="480" y="200" width="190" height="64" rx="6" class="box gold"/>
  <text x="500" y="226" class="txt">continuous</text>
  <text x="500" y="248" class="small">linear map B z_i</text>

  <rect x="720" y="200" width="420" height="64" rx="6" class="box gold"/>
  <text x="740" y="226" class="txt">item factor</text>
  <text x="740" y="248" class="small">q(i,z_i) = q_i + E_i g_i + B z_i</text>

  <line x1="230" y1="232" x2="260" y2="232" class="line" marker-end="url(#arrow-muted2)"/>
  <line x1="450" y1="232" x2="480" y2="232" class="line" marker-end="url(#arrow-muted2)"/>
  <line x1="670" y1="232" x2="720" y2="232" class="line" marker-end="url(#arrow-muted2)"/>

  <rect x="720" y="340" width="420" height="64" rx="6" class="box cyan"/>
  <text x="740" y="366" class="txt">interaction</text>
  <text x="740" y="388" class="small">r_hat = p(u,x_u)^T q(i,z_i)</text>

  <rect x="1180" y="340" width="180" height="64" rx="6" class="box gold"/>
  <text x="1270" y="379" class="txt" text-anchor="middle">rating</text>

  <polyline points="720,92 680,92 680,360 720,360" class="line-gold" marker-end="url(#arrow-gold2)"/>
  <polyline points="720,232 700,232 700,390 720,390" class="line-gold" marker-end="url(#arrow-gold2)"/>
  <line x1="1140" y1="372" x2="1180" y2="372" class="line-gold" marker-end="url(#arrow-gold2)"/>

  <text x="40" y="470" class="txt" font-size="24">ID rows, category embeddings, and continuous maps are all learned together.</text>
  <text x="40" y="502" class="small" font-size="18">For a new user, set p_u = 0 and b_u = 0; the feature terms still produce a factor.</text>
</svg>
