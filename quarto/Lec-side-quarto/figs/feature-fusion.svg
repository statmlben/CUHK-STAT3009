<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="User and item features are encoded into vectors, concatenated, and passed through an MLP.">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#dda300"/>
    </marker>
    <style>
      .box { fill: #151b22; stroke: rgba(255,255,255,.20); stroke-width: 1.4; }
      .gold { stroke: #dda300; }
      .violet { stroke: #a65b9f; }
      .cyan { stroke: #4fb3bf; }
      .txt { fill: #f2f0eb; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; font-size: 21px; }
      .small { fill: #c3c0c8; font-family: Menlo, monospace; font-size: 15px; }
      .kicker { fill: #dda300; font-family: Menlo, monospace; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
      .line { stroke: #dda300; stroke-width: 1.7; fill: none; }
    </style>
  </defs>

  <text x="40" y="42" class="kicker">USER SIDE</text>
  <rect x="40" y="62" width="260" height="70" rx="6" class="box violet"/>
  <text x="58" y="90" class="txt">user features</text>
  <text x="58" y="114" class="small">numeric + categorical</text>

  <rect x="340" y="62" width="280" height="70" rx="6" class="box violet"/>
  <text x="358" y="90" class="txt">user encoder</text>
  <text x="358" y="114" class="small">preprocess + embedding</text>

  <rect x="660" y="62" width="220" height="70" rx="6" class="box gold"/>
  <text x="678" y="90" class="txt">user vector</text>
  <text x="678" y="114" class="small">h_u</text>

  <text x="40" y="184" class="kicker">ITEM SIDE</text>
  <rect x="40" y="204" width="260" height="70" rx="6" class="box gold"/>
  <text x="58" y="232" class="txt">item features</text>
  <text x="58" y="256" class="small">numeric + categorical</text>

  <rect x="340" y="204" width="280" height="70" rx="6" class="box gold"/>
  <text x="358" y="232" class="txt">item encoder</text>
  <text x="358" y="256" class="small">preprocess + embedding</text>

  <rect x="660" y="204" width="220" height="70" rx="6" class="box gold"/>
  <text x="678" y="232" class="txt">item vector</text>
  <text x="678" y="256" class="small">h_i</text>

  <rect x="930" y="100" width="180" height="136" rx="6" class="box cyan"/>
  <text x="948" y="150" class="txt">concat</text>
  <text x="948" y="174" class="small">[ h_u , h_i ]</text>

  <rect x="1150" y="100" width="180" height="136" rx="6" class="box gold"/>
  <text x="1168" y="150" class="txt">MLP</text>
  <text x="1168" y="174" class="small">Linear → ReLU</text>

  <rect x="1370" y="128" width="180" height="80" rx="6" class="box gold"/>
  <text x="1460" y="174" class="txt" text-anchor="middle">rating</text>

  <line x1="300" y1="97" x2="340" y2="97" class="line" marker-end="url(#arrow)"/>
  <line x1="620" y1="97" x2="660" y2="97" class="line" marker-end="url(#arrow)"/>
  <line x1="300" y1="239" x2="340" y2="239" class="line" marker-end="url(#arrow)"/>
  <line x1="620" y1="239" x2="660" y2="239" class="line" marker-end="url(#arrow)"/>
  <line x1="880" y1="97" x2="930" y2="120" class="line" marker-end="url(#arrow)"/>
  <line x1="880" y1="239" x2="930" y2="216" class="line" marker-end="url(#arrow)"/>
  <line x1="1110" y1="168" x2="1150" y2="168" class="line" marker-end="url(#arrow)"/>
  <line x1="1330" y1="168" x2="1370" y2="168" class="line" marker-end="url(#arrow)"/>

  <text x="40" y="348" class="txt" font-size="23">Every modality is encoded into a vector; the fusion block only sees vectors.</text>
  <text x="40" y="380" class="small" font-size="17">Swap the encoder without changing the rest of the model.</text>
</svg>
