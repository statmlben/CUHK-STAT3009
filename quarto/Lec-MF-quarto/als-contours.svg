<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 490" role="img" aria-labelledby="title description">
  <title id="title">Alternating least squares follows a zigzag path across loss contours</title>
  <desc id="description">Starting at point zero, vertical item-block updates alternate with horizontal user-block updates. Each step reaches a lower contour of the schematic objective.</desc>
  <defs>
    <clipPath id="plot-area"><rect x="126" y="20" width="1050" height="419"/></clipPath>
    <marker id="item-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#df95d7"/>
    </marker>
    <marker id="user-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#e3b337"/>
    </marker>
  </defs>

  <g clip-path="url(#plot-area)" fill="none" stroke="#527187" stroke-width="2.5" opacity=".58">
    <ellipse cx="825" cy="385" rx="95" ry="46" transform="rotate(14 825 385)"/>
    <ellipse cx="825" cy="385" rx="178" ry="86" transform="rotate(14 825 385)"/>
    <ellipse cx="825" cy="385" rx="262" ry="126" transform="rotate(14 825 385)"/>
    <ellipse cx="825" cy="385" rx="346" ry="167" transform="rotate(14 825 385)"/>
    <ellipse cx="825" cy="385" rx="430" ry="207" transform="rotate(14 825 385)"/>
    <ellipse cx="825" cy="385" rx="514" ry="248" transform="rotate(14 825 385)"/>
    <ellipse cx="825" cy="385" rx="598" ry="288" transform="rotate(14 825 385)"/>
  </g>

  <g fill="none" stroke="#9daebc" stroke-width="3">
    <path d="M 126 439 H 1185"/>
    <path d="M 126 439 V 24"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#d5dbe0">
    <text x="845" y="480">user block (a, P)</text>
    <text x="32" y="294" transform="rotate(-90 32 294)">item block (b, Q)</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-width="8">
    <path d="M 235 111 V 235" stroke="#df95d7" marker-end="url(#item-arrow)"/>
    <path d="M 253 255 H 498" stroke="#e3b337" marker-end="url(#user-arrow)"/>
    <path d="M 525 273 V 317" stroke="#df95d7" marker-end="url(#item-arrow)"/>
    <path d="M 544 337 H 678" stroke="#e3b337" marker-end="url(#user-arrow)"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">
    <circle cx="235" cy="95" r="18" fill="#101d28" stroke="#f0f4f6" stroke-width="3"/><text x="235" y="102" fill="#fff">0</text>
    <circle cx="235" cy="255" r="18" fill="#101d28" stroke="#df95d7" stroke-width="3"/><text x="235" y="262" fill="#fff">1</text>
    <circle cx="525" cy="255" r="18" fill="#101d28" stroke="#e3b337" stroke-width="3"/><text x="525" y="262" fill="#fff">2</text>
    <circle cx="525" cy="337" r="18" fill="#101d28" stroke="#df95d7" stroke-width="3"/><text x="525" y="344" fill="#fff">3</text>
    <circle cx="700" cy="337" r="18" fill="#101d28" stroke="#e3b337" stroke-width="3"/><text x="700" y="344" fill="#fff">4</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="650">
    <text x="270" y="91" fill="#f0f4f6">start</text>
    <text x="855" y="365" fill="#e3b337">lower J</text>
  </g>
  <circle cx="825" cy="385" r="8" fill="#e3b337"/>
</svg>
