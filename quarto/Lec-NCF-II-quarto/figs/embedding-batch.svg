<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-label="Three ID chips select three rows from the embedding table and produce three vector cards in input order.">
  <defs>
    <marker id="eb2-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dda300"/>
    </marker>
    <marker id="eb2-arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a65b9f"/>
    </marker>
  </defs>

  <!-- soft panel -->
  <rect x="20" y="20" width="1360" height="398" rx="16" fill="rgba(255,255,255,0.018)" stroke="rgba(255,255,255,0.07)"/>

  <!-- step labels -->
  <text x="55" y="62" font-family="Menlo, monospace" font-size="16" font-weight="700" fill="#dda300">1 · IDs (B,)</text>
  <text x="300" y="62" font-family="Menlo, monospace" font-size="16" font-weight="700" fill="#dda300">2 · LOOKUP</text>
  <text x="850" y="62" font-family="Menlo, monospace" font-size="16" font-weight="700" fill="#dda300">3 · VECTORS (B,K)</text>
  <text x="1325" y="62" text-anchor="end" font-family="Menlo, monospace" font-size="14" fill="#aaa8ae">B = 3 · K = 4</text>

  <!-- ID chips -->
  <g font-family="Menlo, monospace" font-size="22" text-anchor="middle">
    <rect x="55" y="100" width="110" height="56" rx="9" fill="rgba(221,163,0,0.12)" stroke="#dda300" stroke-width="2"/>
    <text x="110" y="136" fill="#f2f0eb">2</text>
    <rect x="55" y="180" width="110" height="56" rx="9" fill="rgba(221,163,0,0.12)" stroke="#dda300" stroke-width="2"/>
    <text x="110" y="216" fill="#f2f0eb">0</text>
    <rect x="55" y="260" width="110" height="56" rx="9" fill="rgba(221,163,0,0.12)" stroke="#dda300" stroke-width="2"/>
    <text x="110" y="296" fill="#f2f0eb">1</text>
  </g>
  <text x="110" y="345" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c3c0c8">one row per ID</text>

  <!-- arrow IDs -> table -->
  <line x1="170" y1="210" x2="286" y2="232" stroke="#dda300" stroke-width="3" marker-end="url(#eb2-arrow)"/>
  <text x="222" y="198" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#c3c0c8">select</text>

  <!-- table -->
  <rect x="295" y="92" width="420" height="286" rx="12" fill="rgba(0,0,0,0.10)" stroke="#a65b9f" stroke-width="1.5"/>
  <g font-family="Menlo, monospace" font-size="14" fill="#c3c0c8">
    <text x="315" y="120">ID</text><text x="385" y="120">k1</text><text x="465" y="120">k2</text><text x="545" y="120">k3</text><text x="625" y="120">k4</text>
  </g>
  <g font-family="Menlo, monospace" font-size="15">
    <!-- row 0 -->
    <rect x="305" y="132" width="400" height="46" rx="5" fill="rgba(221,163,0,0.06)"/>
    <circle cx="318" cy="155" r="3.5" fill="#dda300"/>
    <text x="330" y="160" fill="#c3c0c8">0</text><text x="385" y="160" fill="#c3c0c8">0.12</text><text x="465" y="160" fill="#c3c0c8">-0.31</text><text x="545" y="160" fill="#c3c0c8">0.55</text><text x="625" y="160" fill="#c3c0c8">0.08</text>

    <!-- row 1 -->
    <rect x="305" y="182" width="400" height="46" rx="5" fill="rgba(221,163,0,0.06)"/>
    <circle cx="318" cy="205" r="3.5" fill="#dda300"/>
    <text x="330" y="210" fill="#c3c0c8">1</text><text x="385" y="210" fill="#c3c0c8">-0.22</text><text x="465" y="210" fill="#c3c0c8">0.44</text><text x="545" y="210" fill="#c3c0c8">0.10</text><text x="625" y="210" fill="#c3c0c8">-0.36</text>

    <!-- row 2 -->
    <rect x="305" y="232" width="400" height="50" rx="5" fill="rgba(221,163,0,0.16)" stroke="#dda300" stroke-width="1.5"/>
    <circle cx="318" cy="257" r="4" fill="#dda300"/>
    <text x="330" y="262" fill="#dda300" font-weight="700">2</text><text x="385" y="262" fill="#dda300">0.40</text><text x="465" y="262" fill="#dda300">-0.20</text><text x="545" y="262" fill="#dda300">0.70</text><text x="625" y="262" fill="#dda300">0.10</text>

    <!-- row 3 -->
    <text x="330" y="315" fill="#8f8b94">3</text><text x="385" y="315" fill="#8f8b94">0.05</text><text x="465" y="315" fill="#8f8b94">0.18</text><text x="545" y="315" fill="#8f8b94">-0.42</text><text x="625" y="315" fill="#8f8b94">0.27</text>
  </g>
  <text x="505" y="365" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#8f8b94">rows 0, 1, 2 are looked up; row 3 is not</text>

  <!-- arrow table -> vectors -->
  <line x1="720" y1="232" x2="836" y2="232" stroke="#a65b9f" stroke-width="3" marker-end="url(#eb2-arrow-purple)"/>
  <text x="778" y="220" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#c3c0c8">stack</text>

  <!-- output cards -->
  <g font-family="Menlo, monospace" font-size="15">
    <rect x="845" y="100" width="500" height="70" rx="9" fill="rgba(166,91,159,0.10)" stroke="#a65b9f" stroke-width="1.5"/>
    <text x="865" y="141" fill="#dda300" font-size="19" font-weight="700">p_2</text>
    <text x="950" y="141" fill="#f2f0eb">0.40</text><text x="1040" y="141" fill="#f2f0eb">-0.20</text><text x="1130" y="141" fill="#f2f0eb">0.70</text><text x="1220" y="141" fill="#f2f0eb">0.10</text>

    <rect x="845" y="184" width="500" height="70" rx="9" fill="rgba(166,91,159,0.10)" stroke="#a65b9f" stroke-width="1.5"/>
    <text x="865" y="225" fill="#dda300" font-size="19" font-weight="700">p_0</text>
    <text x="950" y="225" fill="#f2f0eb">0.12</text><text x="1040" y="225" fill="#f2f0eb">-0.31</text><text x="1130" y="225" fill="#f2f0eb">0.55</text><text x="1220" y="225" fill="#f2f0eb">0.08</text>

    <rect x="845" y="268" width="500" height="70" rx="9" fill="rgba(166,91,159,0.10)" stroke="#a65b9f" stroke-width="1.5"/>
    <text x="865" y="309" fill="#dda300" font-size="19" font-weight="700">p_1</text>
    <text x="950" y="309" fill="#f2f0eb">-0.22</text><text x="1040" y="309" fill="#f2f0eb">0.44</text><text x="1130" y="309" fill="#f2f0eb">0.10</text><text x="1220" y="309" fill="#f2f0eb">-0.36</text>
  </g>
  <text x="1095" y="365" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#c3c0c8">rows keep the input order</text>

  <text x="55" y="400" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#dda300">Input [2, 0, 1] → output [p_2, p_0, p_1].</text>
</svg>
