<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="340" viewBox="0 0 1300 340" role="img" aria-label="MF as a two-branch network: user and item IDs are looked up in embedding tables, then combined by an inner product.">
  <defs>
    <marker id="mf-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a65b9f"/>
    </marker>
    <marker id="mf-arrow-gold" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dda300"/>
    </marker>
  </defs>

  <!-- user branch -->
  <rect x="60" y="70" width="170" height="80" rx="8" fill="rgba(255,255,255,0.04)" stroke="#d1cdd3" stroke-width="1.5"/>
  <text x="145" y="104" text-anchor="middle" font-family="Menlo, monospace" font-size="20" fill="#f2f0eb">user ID</text>
  <text x="145" y="132" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#c3c0c8">(B,)</text>

  <line x1="230" y1="110" x2="305" y2="110" stroke="#a65b9f" stroke-width="3" marker-end="url(#mf-arrow)"/>

  <rect x="315" y="70" width="210" height="80" rx="8" fill="rgba(166,91,159,0.12)" stroke="#a65b9f" stroke-width="2"/>
  <text x="420" y="102" text-anchor="middle" font-family="Menlo, monospace" font-size="19" fill="#f2f0eb">Embedding</text>
  <text x="420" y="130" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#c3c0c8">(B,K)</text>

  <line x1="525" y1="110" x2="600" y2="110" stroke="#a65b9f" stroke-width="3" marker-end="url(#mf-arrow)"/>

  <rect x="610" y="70" width="170" height="80" rx="8" fill="rgba(221,163,0,0.08)" stroke="#dda300" stroke-width="2"/>
  <text x="695" y="104" text-anchor="middle" font-family="Menlo, monospace" font-size="20" fill="#f2f0eb">p_u</text>
  <text x="695" y="132" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#c3c0c8">(B,K)</text>

  <!-- item branch -->
  <rect x="60" y="210" width="170" height="80" rx="8" fill="rgba(255,255,255,0.04)" stroke="#d1cdd3" stroke-width="1.5"/>
  <text x="145" y="244" text-anchor="middle" font-family="Menlo, monospace" font-size="20" fill="#f2f0eb">item ID</text>
  <text x="145" y="272" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#c3c0c8">(B,)</text>

  <line x1="230" y1="250" x2="305" y2="250" stroke="#a65b9f" stroke-width="3" marker-end="url(#mf-arrow)"/>

  <rect x="315" y="210" width="210" height="80" rx="8" fill="rgba(166,91,159,0.12)" stroke="#a65b9f" stroke-width="2"/>
  <text x="420" y="242" text-anchor="middle" font-family="Menlo, monospace" font-size="19" fill="#f2f0eb">Embedding</text>
  <text x="420" y="270" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#c3c0c8">(B,K)</text>

  <line x1="525" y1="250" x2="600" y2="250" stroke="#a65b9f" stroke-width="3" marker-end="url(#mf-arrow)"/>

  <rect x="610" y="210" width="170" height="80" rx="8" fill="rgba(221,163,0,0.08)" stroke="#dda300" stroke-width="2"/>
  <text x="695" y="244" text-anchor="middle" font-family="Menlo, monospace" font-size="20" fill="#f2f0eb">q_i</text>
  <text x="695" y="272" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#c3c0c8">(B,K)</text>

  <!-- merge -->
  <path d="M 780 110 C 830 110, 830 180, 880 180" fill="none" stroke="#a65b9f" stroke-width="3"/>
  <path d="M 780 250 C 830 250, 830 180, 880 180" fill="none" stroke="#a65b9f" stroke-width="3"/>
  <line x1="872" y1="180" x2="888" y2="180" stroke="#a65b9f" stroke-width="3" marker-end="url(#mf-arrow)"/>

  <rect x="900" y="138" width="200" height="84" rx="8" fill="rgba(221,163,0,0.08)" stroke="#dda300" stroke-width="2"/>
  <text x="1000" y="174" text-anchor="middle" font-family="Menlo, monospace" font-size="19" fill="#f2f0eb">dot product</text>
  <text x="1000" y="202" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#c3c0c8">(B,1)</text>

  <line x1="1100" y1="180" x2="1160" y2="180" stroke="#dda300" stroke-width="3" marker-end="url(#mf-arrow-gold)"/>

  <rect x="1170" y="138" width="90" height="84" rx="8" fill="rgba(221,163,0,0.10)" stroke="#dda300" stroke-width="2"/>
  <text x="1215" y="174" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#f2f0eb">score</text>
  <text x="1215" y="202" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#c3c0c8">(B,1)</text>

</svg>
