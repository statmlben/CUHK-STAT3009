<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="420" viewBox="0 0 1300 420" role="img" aria-label="Known IDs use a learned embedding row; a new ID has no row, so side features go through an MLP to build a vector.">
  <defs>
    <marker id="si-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a65b9f"/>
    </marker>
    <marker id="si-arrow-gold" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dda300"/>
    </marker>
  </defs>

  <!-- divider -->
  <line x1="650" y1="40" x2="650" y2="380" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

  <!-- known -->
  <text x="50" y="44" font-family="Menlo, monospace" font-size="16" font-weight="700" fill="#dda300">KNOWN ID</text>
  <rect x="50" y="80" width="90" height="50" rx="7" fill="rgba(221,163,0,0.12)" stroke="#dda300" stroke-width="2"/>
  <text x="95" y="111" text-anchor="middle" font-family="Menlo, monospace" font-size="18" fill="#f2f0eb">ID 2</text>
  <line x1="140" y1="105" x2="180" y2="105" stroke="#a65b9f" stroke-width="2.5" marker-end="url(#si-arrow)"/>

  <rect x="190" y="70" width="180" height="76" rx="8" fill="rgba(166,91,159,0.10)" stroke="#a65b9f" stroke-width="2"/>
  <rect x="200" y="92" width="160" height="34" rx="4" fill="rgba(221,163,0,0.18)" stroke="#dda300" stroke-width="1.5"/>
  <text x="280" y="115" text-anchor="middle" font-family="Menlo, monospace" font-size="15" fill="#dda300">row 2</text>
  <text x="280" y="164" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#c3c0c8">learned lookup</text>

  <line x1="370" y1="105" x2="410" y2="105" stroke="#a65b9f" stroke-width="2.5" marker-end="url(#si-arrow)"/>
  <rect x="420" y="80" width="100" height="50" rx="6" fill="rgba(221,163,0,0.10)" stroke="#dda300" stroke-width="2"/>
  <text x="470" y="111" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#dda300">p_2</text>

  <line x1="520" y1="105" x2="560" y2="105" stroke="#a65b9f" stroke-width="2.5" marker-end="url(#si-arrow)"/>
  <rect x="570" y="80" width="60" height="50" rx="6" fill="rgba(255,255,255,0.04)" stroke="#c3c0c8" stroke-width="1.5"/>
  <text x="600" y="111" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#f2f0eb">score</text>

  <!-- new -->
  <text x="700" y="44" font-family="Menlo, monospace" font-size="16" font-weight="700" fill="#dda300">NEW ID</text>
  <rect x="700" y="80" width="90" height="50" rx="7" fill="rgba(255,255,255,0.04)" stroke="#c3c0c8" stroke-width="1.5"/>
  <text x="745" y="111" text-anchor="middle" font-family="Menlo, monospace" font-size="18" fill="#f2f0eb">ID ?</text>
  <line x1="790" y1="105" x2="830" y2="105" stroke="#c3c0c8" stroke-width="2.5" marker-end="url(#si-arrow)"/>

  <rect x="840" y="70" width="180" height="76" rx="8" fill="rgba(255,255,255,0.02)" stroke="#8f8b94" stroke-width="1.5"/>
  <text x="930" y="102" text-anchor="middle" font-family="Menlo, monospace" font-size="15" fill="#8f8b94">no row</text>
  <text x="930" y="128" text-anchor="middle" font-family="Menlo, monospace" font-size="20" fill="#8f8b94">✕</text>
  <text x="930" y="164" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#8f8b94">ID-only path fails</text>

  <!-- side features -->
  <text x="700" y="218" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#dda300">Side features</text>
  <g font-family="Menlo, monospace" font-size="14" text-anchor="middle">
    <rect x="700" y="232" width="90" height="34" rx="5" fill="rgba(166,91,159,0.10)" stroke="#a65b9f"/>
    <text x="745" y="254" fill="#f2f0eb">age</text>
    <rect x="800" y="232" width="90" height="34" rx="5" fill="rgba(166,91,159,0.10)" stroke="#a65b9f"/>
    <text x="845" y="254" fill="#f2f0eb">region</text>
    <rect x="900" y="232" width="90" height="34" rx="5" fill="rgba(166,91,159,0.10)" stroke="#a65b9f"/>
    <text x="945" y="254" fill="#f2f0eb">history</text>
  </g>

  <line x1="790" y1="266" x2="840" y2="296" stroke="#a65b9f" stroke-width="2.5" marker-end="url(#si-arrow)"/>
  <rect x="850" y="286" width="150" height="64" rx="8" fill="rgba(166,91,159,0.12)" stroke="#a65b9f" stroke-width="2"/>
  <text x="925" y="314" text-anchor="middle" font-family="Menlo, monospace" font-size="16" fill="#f2f0eb">MLP</text>
  <text x="925" y="336" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#c3c0c8">build a vector</text>

  <line x1="1000" y1="318" x2="1040" y2="318" stroke="#a65b9f" stroke-width="2.5" marker-end="url(#si-arrow)"/>
  <rect x="1050" y="292" width="110" height="52" rx="6" fill="rgba(221,163,0,0.10)" stroke="#dda300" stroke-width="2"/>
  <text x="1105" y="324" text-anchor="middle" font-family="Menlo, monospace" font-size="15" fill="#dda300">p_new</text>

  <line x1="1160" y1="318" x2="1200" y2="318" stroke="#a65b9f" stroke-width="2.5" marker-end="url(#si-arrow)"/>
  <rect x="1210" y="292" width="60" height="52" rx="6" fill="rgba(255,255,255,0.04)" stroke="#c3c0c8" stroke-width="1.5"/>
  <text x="1240" y="324" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#f2f0eb">score</text>

  <text x="50" y="400" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#dda300">Same prediction pipeline; side information builds a vector for an unseen ID.</text>
</svg>
