<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Cross-validation RMSE for four NCF settings; K=16 and hidden=16 is best at 0.9791.">
  <text x="40" y="32" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#f2f0eb">CV RMSE (lower is better)</text>
  <text x="1120" y="32" text-anchor="end" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#aaa8ae">axis starts at 0.975</text>

  <!-- rows -->
  <g font-family="Menlo, monospace" font-size="18" fill="#f2f0eb" text-anchor="end">
    <text x="230" y="105">K=16, h=16</text>
    <text x="230" y="165">K=16, h=32</text>
    <text x="230" y="225">K=8, h=32</text>
    <text x="230" y="285">K=8, h=16</text>
  </g>

  <!-- best marker -->
  <line x1="401" y1="55" x2="401" y2="315" stroke="#dda300" stroke-width="2" stroke-dasharray="7 7" opacity="0.65"/>
  <text x="407" y="52" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#dda300">best</text>

  <!-- bars: x = 260 + (value - .975)/.025 * 860 -->
  <rect x="260" y="80" width="141" height="34" rx="4" fill="#dda300"/>
  <text x="411" y="104" font-family="Menlo, monospace" font-size="18" fill="#dda300">0.9791</text>

  <rect x="260" y="140" width="306" height="34" rx="4" fill="#a65b9f"/>
  <text x="576" y="164" font-family="Menlo, monospace" font-size="18" fill="#c3c0c8">0.9839</text>

  <rect x="260" y="200" width="585" height="34" rx="4" fill="#a65b9f"/>
  <text x="855" y="224" font-family="Menlo, monospace" font-size="18" fill="#c3c0c8">0.9920</text>

  <rect x="260" y="260" width="688" height="34" rx="4" fill="#a65b9f"/>
  <text x="958" y="284" font-family="Menlo, monospace" font-size="18" fill="#c3c0c8">0.9950</text>

  <!-- axis -->
  <line x1="260" y1="315" x2="1120" y2="315" stroke="#c3c0c8" stroke-width="1.5"/>
  <g font-family="Menlo, monospace" font-size="15" fill="#aaa8ae" text-anchor="middle">
    <text x="260" y="340">0.975</text>
    <text x="547" y="340">0.983</text>
    <text x="833" y="340">0.992</text>
    <text x="1120" y="340">1.000</text>
  </g>

  <text x="40" y="370" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#dda300">selected: K=16, hidden=16 · test RMSE 0.9569</text>
</svg>
