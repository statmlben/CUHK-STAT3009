<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Cross-validation RMSE for four NCF settings; K=16 and hidden=32 is best at 0.9874.">
  <text x="40" y="32" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#f2f0eb">CV RMSE (lower is better)</text>
  <text x="1120" y="32" text-anchor="end" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#aaa8ae">axis starts at 0.985</text>

  <!-- rows -->
  <g font-family="Menlo, monospace" font-size="18" fill="#f2f0eb" text-anchor="end">
    <text x="230" y="105">K=16, h=32</text>
    <text x="230" y="165">K=16, h=16</text>
    <text x="230" y="225">K=8, h=32</text>
    <text x="230" y="285">K=8, h=16</text>
  </g>

  <!-- best marker -->
  <line x1="398" y1="55" x2="398" y2="315" stroke="#dda300" stroke-width="2" stroke-dasharray="7 7" opacity="0.65"/>
  <text x="404" y="52" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#dda300">best</text>

  <!-- bars: x = 260 + (value - .985)/.015 * 860 -->
  <rect x="260" y="80" width="138" height="34" rx="4" fill="#dda300"/>
  <text x="410" y="104" font-family="Menlo, monospace" font-size="18" fill="#dda300">0.9874</text>

  <rect x="260" y="140" width="315" height="34" rx="4" fill="#a65b9f"/>
  <text x="587" y="164" font-family="Menlo, monospace" font-size="18" fill="#c3c0c8">0.9905</text>

  <rect x="260" y="200" width="573" height="34" rx="4" fill="#a65b9f"/>
  <text x="845" y="224" font-family="Menlo, monospace" font-size="18" fill="#c3c0c8">0.9950</text>

  <rect x="260" y="260" width="585" height="34" rx="4" fill="#a65b9f"/>
  <text x="857" y="284" font-family="Menlo, monospace" font-size="18" fill="#c3c0c8">0.9952</text>

  <!-- axis -->
  <line x1="260" y1="315" x2="1120" y2="315" stroke="#c3c0c8" stroke-width="1.5"/>
  <g font-family="Menlo, monospace" font-size="15" fill="#aaa8ae" text-anchor="middle">
    <text x="260" y="340">0.985</text>
    <text x="547" y="340">0.990</text>
    <text x="833" y="340">0.995</text>
    <text x="1120" y="340">1.000</text>
  </g>

  <text x="40" y="370" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#dda300">selected: K=16, hidden=32 · test RMSE 0.9659</text>
</svg>
