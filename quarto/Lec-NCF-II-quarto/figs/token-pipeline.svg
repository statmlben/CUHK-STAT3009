<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="320" viewBox="0 0 1400 320" role="img" aria-label="Text is tokenized, token IDs select embedding rows, and the resulting sequence goes through a Transformer.">
  <defs>
    <marker id="tp-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a65b9f"/>
    </marker>
    <marker id="tp-arrow-gold" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dda300"/>
    </marker>
  </defs>

  <text x="40" y="38" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#f2f0eb">The same lookup, now on tokens</text>

  <!-- text -->
  <rect x="30" y="80" width="200" height="80" rx="8" fill="rgba(255,255,255,0.04)" stroke="#d1cdd3" stroke-width="1.5"/>
  <text x="130" y="112" text-anchor="middle" font-family="Menlo, monospace" font-size="18" fill="#f2f0eb">"I love NCF"</text>
  <text x="130" y="140" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c3c0c8">text</text>

  <line x1="230" y1="120" x2="300" y2="120" stroke="#a65b9f" stroke-width="2.5" marker-end="url(#tp-arrow)"/>

  <!-- tokenizer -->
  <rect x="310" y="80" width="180" height="80" rx="8" fill="rgba(166,91,159,0.12)" stroke="#a65b9f" stroke-width="2"/>
  <text x="400" y="112" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#f2f0eb">tokenizer</text>
  <text x="400" y="140" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c3c0c8">words → subwords</text>

  <line x1="490" y1="120" x2="560" y2="120" stroke="#a65b9f" stroke-width="2.5" marker-end="url(#tp-arrow)"/>

  <!-- token IDs -->
  <rect x="570" y="80" width="240" height="80" rx="8" fill="rgba(221,163,0,0.08)" stroke="#dda300" stroke-width="2"/>
  <text x="690" y="112" text-anchor="middle" font-family="Menlo, monospace" font-size="16" fill="#f2f0eb">[101, 1045, 2293, 102]</text>
  <text x="690" y="140" text-anchor="middle" font-family="Menlo, monospace" font-size="15" fill="#c3c0c8">token IDs (B,T)</text>

  <line x1="810" y1="120" x2="880" y2="120" stroke="#dda300" stroke-width="2.5" marker-end="url(#tp-arrow-gold)"/>

  <!-- embedding table -->
  <rect x="890" y="80" width="190" height="80" rx="8" fill="rgba(166,91,159,0.12)" stroke="#a65b9f" stroke-width="2"/>
  <text x="985" y="112" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#f2f0eb">embedding</text>
  <text x="985" y="140" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c3c0c8">row per token</text>

  <line x1="1080" y1="120" x2="1150" y2="120" stroke="#a65b9f" stroke-width="2.5" marker-end="url(#tp-arrow)"/>

  <!-- matrix + transformer -->
  <rect x="1160" y="80" width="200" height="80" rx="8" fill="rgba(221,163,0,0.08)" stroke="#dda300" stroke-width="2"/>
  <text x="1260" y="112" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#f2f0eb">(B,T,d)</text>
  <text x="1260" y="140" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c3c0c8">one vector per token</text>

  <!-- second row: transformer -->
  <rect x="890" y="220" width="470" height="74" rx="8" fill="rgba(255,255,255,0.03)" stroke="#c3c0c8" stroke-width="1.5"/>
  <text x="1125" y="252" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#f2f0eb">Transformer blocks</text>
  <text x="1125" y="278" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c3c0c8">attention mixes the token vectors</text>

  <line x1="1260" y1="160" x2="1260" y2="212" stroke="#a65b9f" stroke-width="2.5" marker-end="url(#tp-arrow)"/>

</svg>
